name: GitOps Fleet Automation

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate-plan:
    name: Validate Manifests & Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native-ops-conf
        uses: actions/checkout@v4

      - name: Install native-ops Engine
        run: |
          curl -fsSL https://github.com/theta42/native-ops/releases/download/v1.3.0/native-ops_v1.3.0_linux_amd64.tar.gz | tar -xz
          sudo mv native-ops_v1.3.0_linux_amd64 /usr/local/bin/native-ops

      - name: Validate Plan
        run: |
          native-ops validate --config-dir .

  reconcile-fleet:
    name: Reconcile Fleet (Level 0 + DNS + Level 1)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native-ops-conf
        uses: actions/checkout@v4

      - name: Install native-ops Engine
        run: |
          curl -fsSL https://github.com/theta42/native-ops/releases/download/v1.3.0/native-ops_v1.3.0_linux_amd64.tar.gz | tar -xz
          sudo mv native-ops_v1.3.0_linux_amd64 /usr/local/bin/native-ops

      - name: Reconcile Fleet Infrastructure
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          native-ops reconcile --config-dir .
