name: GitOps

# Every pull request and every push to main: the manifests are validated, and what an apply would
# change on the host is shown. Nothing here changes the host: a plan of an uploaded tree applies only
# with an admin's approval (Apply), and a deploy only from a protected tag (Deploy, on Gitea).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # The daemon on your host (edge/Caddyfile routes this name to it).
  NATIVE_OPS_URL: https://native-ops.example.com
  # Pinned and checksum-verified, so a change to the tool is a reviewed change to this file.
  # The checksum is in the release's checksums.txt.
  NATIVE_OPS_VERSION: __NATIVE_OPS_VERSION__
  NATIVE_OPS_SHA256: "__NATIVE_OPS_SHA256__"

jobs:
  plan:
    name: Validate and plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native-ops (pinned, checksum verified)
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"   # outside the checkout: the tree a plan or build uploads must not carry the tool
          curl -fsSL --proto '=https' --tlsv1.2 -o native-ops.tgz \
            "https://github.com/theta42/native-ops/releases/download/${NATIVE_OPS_VERSION}/native-ops_${NATIVE_OPS_VERSION}_linux_amd64.tar.gz"
          echo "${NATIVE_OPS_SHA256}  native-ops.tgz" | sha256sum -c -
          tar -xzf native-ops.tgz
          install -D -m 0755 "native-ops_${NATIVE_OPS_VERSION}_linux_amd64" "$HOME/.local/bin/native-ops"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate
        run: native-ops validate --config-dir .
      - name: Plan against the host
        env:
          NATIVE_OPS_TOKEN: ${{ secrets.NATIVE_OPS_TOKEN }}   # the one deployer token (a plan changes nothing)
        run: |
          set -euo pipefail
          if [ -z "${NATIVE_OPS_TOKEN}" ]; then
            echo "::notice::NATIVE_OPS_TOKEN is not set yet (run the Bootstrap workflow, then create a deployer token on the daemon's Tokens page); skipping the plan"
            exit 0
          fi
          # Exits 1 only when the plan is blocked (an apply would fail). The last line is "plan <hash>":
          # that is what an admin approves before the Apply workflow can run it.
          native-ops remote plan --config-dir .
