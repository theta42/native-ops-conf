name: Secrets

# The daemon's own credentials live in this repository's secret store; this pushes them to the daemon,
# which keeps them on the host (0600, in its state directory) for whatever needs them. Nobody logs in to
# put them there. Run it after the Bootstrap, and whenever one changes. --prune removes from the daemon
# any secret listed below that is empty here, so this repository stays the source of truth.
#
# Values (Settings -> Environments -> bootstrap -> secrets), each optional:
#   DO_API_TOKEN                   DNS sync (dns_records), and the DNS records on the status page
#   BACKUP_S3_ACCESS_KEY           backups (fleet.yml backup:)
#   BACKUP_S3_SECRET_KEY
#   NATIVE_OPS_OIDC_CLIENT_SECRET  OIDC sign-in (the --oidc-* flags in fleet.yml daemon.flags)
# Variables (same environment -> variables), the pins an upload cannot override:
#   BACKUP_ENDPOINT, BACKUP_BUCKET the only backup destination the daemon will use (as in fleet.yml)
#   DNS_ZONES                      the zones a DNS sync may change, comma separated
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/secrets.yml']

env:
  # The daemon on your host (edge/Caddyfile routes this name to it).
  NATIVE_OPS_URL: https://native-ops.example.com
  # Pinned and checksum-verified, so a change to the tool is a reviewed change to this file.
  # The checksum is in the release's checksums.txt.
  NATIVE_OPS_VERSION: v1.54.1
  NATIVE_OPS_SHA256: "ad68ead5b9456bb9174b06b671a0ff22c371c283c760ae7221e7d43182017efc"

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: bootstrap   # an admin token: keep it where a pull request cannot read it
    steps:
      - name: Install native-ops (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o native-ops.tgz \
            "https://github.com/theta42/native-ops/releases/download/${NATIVE_OPS_VERSION}/native-ops_${NATIVE_OPS_VERSION}_linux_amd64.tar.gz"
          echo "${NATIVE_OPS_SHA256}  native-ops.tgz" | sha256sum -c -
          tar -xzf native-ops.tgz
          install -D -m 0755 "native-ops_${NATIVE_OPS_VERSION}_linux_amd64" "$HOME/.local/bin/native-ops"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Push the daemon's secrets
        env:
          NATIVE_OPS_TOKEN: ${{ secrets.NATIVE_OPS_BOOTSTRAP_TOKEN }}
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          NATIVE_OPS_OIDC_CLIENT_SECRET: ${{ secrets.NATIVE_OPS_OIDC_CLIENT_SECRET }}
          NATIVE_OPS_BACKUP_ENDPOINT: ${{ vars.BACKUP_ENDPOINT }}
          NATIVE_OPS_BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          NATIVE_OPS_DNS_ZONES: ${{ vars.DNS_ZONES }}
        run: |
          native-ops remote secret-sync --prune \
            DO_API_TOKEN BACKUP_S3_ACCESS_KEY BACKUP_S3_SECRET_KEY NATIVE_OPS_OIDC_CLIENT_SECRET \
            NATIVE_OPS_BACKUP_ENDPOINT NATIVE_OPS_BACKUP_BUCKET NATIVE_OPS_DNS_ZONES
