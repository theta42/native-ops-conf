name: Apply

# Apply a plan an admin approved (on the daemon's Plans page, or POST /v1/plans/<hash>/approve).
# The daemon plans the tree again and refuses unless it is still exactly that plan, so what was
# reviewed is what runs; it applies it as a job and this waits for it.
on:
  workflow_dispatch:
    inputs:
      hash:
        description: The approved plan's hash (the last line of the plan)
        required: true

env:
  # The daemon on your host (edge/Caddyfile routes this name to it).
  NATIVE_OPS_URL: https://native-ops.example.com
  # Pinned and checksum-verified, so a change to the tool is a reviewed change to this file.
  # The checksum is in the release's checksums.txt.
  NATIVE_OPS_VERSION: v1.55.0
  NATIVE_OPS_SHA256: "754524e2d773a2542dcaf7a1e58506d9c6697048a174513639bf2a1c081c797c"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native-ops (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o native-ops.tgz \
            "https://github.com/theta42/native-ops/releases/download/${NATIVE_OPS_VERSION}/native-ops_${NATIVE_OPS_VERSION}_linux_amd64.tar.gz"
          echo "${NATIVE_OPS_SHA256}  native-ops.tgz" | sha256sum -c -
          tar -xzf native-ops.tgz
          install -D -m 0755 "native-ops_${NATIVE_OPS_VERSION}_linux_amd64" "$HOME/.local/bin/native-ops"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Apply the approved plan
        env:
          NATIVE_OPS_TOKEN: ${{ secrets.NATIVE_OPS_DEPLOY_TOKEN }}   # a deployer token
        run: native-ops remote apply --config-dir . --expect "${{ inputs.hash }}"
