name: Maintenance

# The recurring work, as daemon jobs: this schedule is the schedule. Needs the daemon started with
# --enable-backup and --enable-image-build (fleet.yml daemon.flags), and the backup keys pushed to it by
# the Secrets workflow -- they are on the daemon, not here. DNS records and the edge need no schedule:
# they are part of the plan.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  # The daemon on your host (edge/Caddyfile routes this name to it).
  NATIVE_OPS_URL: https://native-ops.example.com
  # Pinned and checksum-verified, so a change to the tool is a reviewed change to this file.
  # The checksum is in the release's checksums.txt.
  NATIVE_OPS_VERSION: v1.72.1
  NATIVE_OPS_SHA256: "5aa7f370bf393711405895cf79e1b76aa843148d5bf4868e8b3889aaa4003d8d"

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native-ops (pinned, checksum verified)
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"   # outside the checkout: the tree a plan or build uploads must not carry the tool
          curl -fsSL --proto '=https' --tlsv1.2 -o native-ops.tgz \
            "https://github.com/theta42/native-ops/releases/download/${NATIVE_OPS_VERSION}/native-ops_${NATIVE_OPS_VERSION}_linux_amd64.tar.gz"
          echo "${NATIVE_OPS_SHA256}  native-ops.tgz" | sha256sum -c -
          tar -xzf native-ops.tgz
          install -D -m 0755 "native-ops_${NATIVE_OPS_VERSION}_linux_amd64" "$HOME/.local/bin/native-ops"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Back up volumes and apply retention
        env:
          NATIVE_OPS_TOKEN: ${{ secrets.NATIVE_OPS_TOKEN }}
        run: |
          if ! grep -q '^backup:' fleet.yml; then echo "::notice::fleet.yml has no backup section; skipping"; exit 0; fi
          native-ops remote backup --config-dir . --prune
      - name: Prune images no instance runs
        env:
          NATIVE_OPS_TOKEN: ${{ secrets.NATIVE_OPS_TOKEN }}
        run: native-ops remote image-prune
