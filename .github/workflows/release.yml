name: Release an app

# Build an app image from this repo's recipe (images/<app>) at a git ref, on the host, through the
# daemon. An app repository can dispatch this on a tag. The daemon builds only from a recipe an
# admin approved (the daemon's Recipes page): a new ref of an unchanged recipe needs nothing, a
# change to scripts/ or images/ waits for an approval.
#
# A static service (services/<app>) picks the new image up through the next plan and apply. An
# instance managed through the API is moved with POST /v1/instances/<name>/update (see the last step).
on:
  workflow_dispatch:
    inputs:
      app:
        description: The app to build (a directory under images/)
        required: true
        default: hello
      ref:
        description: The git ref to build (a branch or tag)
        required: true
        default: main
      instance:
        description: "Optional: an instance to move to the new image afterwards"
        required: false

env:
  # The daemon on your host (edge/Caddyfile routes this name to it).
  NATIVE_OPS_URL: https://native-ops.example.com
  # Pinned and checksum-verified, so a change to the tool is a reviewed change to this file.
  # The checksum is in the release's checksums.txt.
  NATIVE_OPS_VERSION: v1.54.0
  NATIVE_OPS_SHA256: "b5440ddcf4a2ee4ab766fbe68363784f3a6fbd5752a8ea85a60ab9a2545520d0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native-ops (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o native-ops.tgz \
            "https://github.com/theta42/native-ops/releases/download/${NATIVE_OPS_VERSION}/native-ops_${NATIVE_OPS_VERSION}_linux_amd64.tar.gz"
          echo "${NATIVE_OPS_SHA256}  native-ops.tgz" | sha256sum -c -
          tar -xzf native-ops.tgz
          install -D -m 0755 "native-ops_${NATIVE_OPS_VERSION}_linux_amd64" "$HOME/.local/bin/native-ops"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the image on the host
        env:
          NATIVE_OPS_TOKEN: ${{ secrets.NATIVE_OPS_DEPLOY_TOKEN }}
          APP: ${{ inputs.app }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          conf=$(mktemp --suffix=.tgz)
          tar --exclude=.git -czf "$conf" .
          code=$(curl -sS -o build.json -w '%{http_code}' --max-time 180 -X POST \
            "${NATIVE_OPS_URL}/v1/images/build?app=${APP}&ref=${REF}" \
            -H "Authorization: Bearer ${NATIVE_OPS_TOKEN}" -H 'Content-Type: application/gzip' --data-binary @"$conf")
          if [ "$code" != "202" ]; then
            echo "::error::the daemon answered $code"; cat build.json; echo
            # 403 recipe_not_approved: an admin approves the digest on the daemon's Recipes page.
            exit 1
          fi
          native-ops remote wait --timeout 30m "$(jq -r .job.id build.json)"
      - name: Move the instance to the new image
        if: inputs.instance != ''
        env:
          NATIVE_OPS_TOKEN: ${{ secrets.NATIVE_OPS_DEPLOY_TOKEN }}
          IMAGE: app-${{ inputs.app }}:${{ inputs.ref }}
          INSTANCE: ${{ inputs.instance }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg image "$IMAGE" '{image:$image}')
          code=$(curl -sS -o upd.json -w '%{http_code}' -X POST "${NATIVE_OPS_URL}/v1/instances/${INSTANCE}/update" \
            -H "Authorization: Bearer ${NATIVE_OPS_TOKEN}" -H 'Content-Type: application/json' -d "$payload")
          [ "$code" = "202" ] || { echo "::error::the daemon answered $code"; cat upd.json; exit 1; }
          native-ops remote wait "$(jq -r .job.id upd.json)"
