name: Bootstrap

# Run by hand: brings the fleet's hosts up. It creates any host fleet.yml declares that does not
# exist yet (installing the native-ops daemon from cloud-init, with only the bootstrap token's
# hash), points DNS at it, prepares Incus, and -- the first time -- deploys the services and the
# edge config directly over SSH, so the daemon becomes reachable at NATIVE_OPS_URL. From then on
# every change goes through the daemon (GitOps, Apply, Edge); re-running this is safe and only
# touches hosts.
#
# Secrets (keep them in a protected environment named "bootstrap": the bootstrap token is an admin
# credential, and a pull request must never be able to read it):
#   DO_API_TOKEN                DigitalOcean API token
#   SSH_PRIVATE_KEY             the key reconcile logs in with (its public half goes on the host)
#   NATIVE_OPS_BOOTSTRAP_TOKEN  nops_ + 64 hex characters you generate; the daemon's first admin
on:
  workflow_dispatch:
    inputs:
      deploy_services:
        description: Also deploy services and the edge config over SSH (the first bootstrap, or a broken daemon)
        type: boolean
        default: true

env:
  # The daemon on your host (edge/Caddyfile routes this name to it).
  NATIVE_OPS_URL: https://native-ops.example.com
  # Pinned and checksum-verified, so a change to the tool is a reviewed change to this file.
  # The checksum is in the release's checksums.txt.
  NATIVE_OPS_VERSION: v1.54.0
  NATIVE_OPS_SHA256: "REPLACE_WITH_SHA256_FROM_CHECKSUMS_TXT"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: bootstrap
    steps:
      - uses: actions/checkout@v4
      - name: Install native-ops (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o native-ops.tgz \
            "https://github.com/theta42/native-ops/releases/download/${NATIVE_OPS_VERSION}/native-ops_${NATIVE_OPS_VERSION}_linux_amd64.tar.gz"
          echo "${NATIVE_OPS_SHA256}  native-ops.tgz" | sha256sum -c -
          tar -xzf native-ops.tgz
          install -D -m 0755 "native-ops_${NATIVE_OPS_VERSION}_linux_amd64" "$HOME/.local/bin/native-ops"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Bring the hosts up
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          NATIVE_OPS_BOOTSTRAP_TOKEN: ${{ secrets.NATIVE_OPS_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.deploy_services }}" = "true" ]; then
            native-ops reconcile --config-dir . --deploy-services
          else
            native-ops reconcile --config-dir .
          fi
