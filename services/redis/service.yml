# A cache from its upstream OCI image, with a data volume. No healthcheck: it does not speak
# HTTP, and a check here is an HTTP probe.
name: redis
image: docker:redis:7-alpine
profiles:
  - base
  - service

volumes:
  - name: redis-data
    path: /data
    pool: default
    shifted: true

limits:
  limits.cpu: "1"
  limits.memory: "1GB"
