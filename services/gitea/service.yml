# A self-hosted Git server from its upstream OCI image, with its data on a volume and a route.
name: gitea
image: docker.io/gitea/gitea:latest-rootless
profiles:
  - base
  - service

volumes:
  - name: gitea-data
    path: /var/lib/gitea
    pool: default
    shifted: true            # security.shifted=true: the container's uids map onto the volume

limits:
  limits.cpu: "2"
  limits.memory: "2GB"

healthcheck:                 # an HTTP check: apply waits for it before routing traffic
  path: /
  port: 3000
  timeout: 60

routing:
  domain: git.example.com
  upstream_port: 3000
