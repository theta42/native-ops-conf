# An application built from this repo's own recipe (images/hello), the native pattern: a systemd
# service that reads its configuration from /etc/default/hello, which native-ops writes from `env`.
# It lives here, not in services/, because a bootstrap deploys every service and this image does not
# exist yet. Build it first (the "Release an app" workflow with app=hello; the daemon builds only from
# a recipe an admin approved), then copy this directory to services/hello: the next plan creates it.
name: hello
image: app-hello:latest
profiles:
  - base
  - service

limits:
  limits.cpu: "1"
  limits.memory: "256MB"

env:
  GREETING: "Hello from native-ops"
  PORT: "8080"

healthcheck:
  path: /health
  port: 8080
  timeout: 30

routing:
  domain: hello.example.com
  upstream_port: 8080
