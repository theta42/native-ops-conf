# Fleet configuration for native-ops (https://github.com/theta42/native-ops).
# Rename the fleet and set your base domain; everything below it is read by `native-ops`.
name: my-fleet
domain: example.com          # reconcile points @ and * of this zone at the host
dns_provider: digitalocean   # the built-in provider (needs DO_API_TOKEN)

network:
  bridge_name: incusbr0
  ipv4_cidr: 10.0.100.0/24

providers:
  digitalocean:
    region: nyc1
    default_size: s-4vcpu-8gb   # the size reconcile creates a host with

# The hosts. `address: auto` means reconcile looks the host up by name at the provider and
# creates it if it does not exist (it never destroys or rebuilds one). A host you already run:
# `provider: static` and its IP in `address`.
hosts:
  node-01:
    provider: digitalocean
    address: auto

# The native-ops daemon a new host installs from cloud-init. CI talks to it; nobody logs in.
# Pin a release and its checksum (from the release's checksums.txt): a change to the daemon is a
# reviewed change to this file. Uncomment once you have picked the release.
#
# The flags: the daemon listens on the Incus bridge, where the edge reaches it (edge/Caddyfile routes
# native-ops.<domain> to it), and turns on what CI drives. Drop what you do not use.
#
# Once the daemon runs, a deploy tag whose commit pins another release upgrades the daemon to it. For
# deploy tags add --git-url https://github.com (or your Gitea) --deploy-repo <owner>/<this repo>.
#
# daemon:
#   version: v1.72.0
#   sha256: 4866753fe79d0cac88e493e2f24a6aa0d92820fa29788adcce9f5a3f3acebcfd
#   flags: "--addr 10.0.100.1:8686 --enable-apply --enable-image-build --enable-backup --enable-auth"

# Off-host backups of the data volumes to any S3-compatible store (`native-ops remote backup`,
# run nightly by .github/workflows/maintenance.yml). The keys, and this endpoint and bucket as the
# pinned destination, are pushed to the daemon by the Secrets workflow, never written here.
#
# backup:
#   endpoint: https://nyc3.digitaloceanspaces.com
#   region: nyc3
#   bucket: my-fleet-backups
#   prefix: incus/
#   retain_daily: 7
#   retain_monthly: 6

# Records native-ops keeps beyond the apex and wildcard A (create or update only; it never deletes).
# Each names its zone. They are part of the plan: a pull request shows the change, and the next deploy
# (or approved apply) makes it.
#
# dns_records:
#   - zone: example.com
#     type: TXT
#     name: "@"
#     value: "v=spf1 -all"
